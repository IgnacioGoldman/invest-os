name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
      timezone: Europe/Stockholm

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install pydantic==2.7.4 python-dotenv==1.0.1 requests==2.32.3 yfinance==1.4.1

      - name: Refresh stock data
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'IgnacioGoldman/invest-os GitHub Actions contact=IgnacioGoldman@users.noreply.github.com' }}
        run: |
          python scripts/open_data_poc.py \
            --universe-file data/stocks/stocks.json \
            --workers 4 \
            --ticker-retries 2 \
            --request-retries 2 \
            --request-timeout 20 \
            --skip-filing-details \
            --min-coverage 0

      - name: Build derived signals
        run: python scripts/build_stock_derived_signals.py

      - name: Export static JSON
        run: python scripts/export_static_site_data.py

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_DATA_MODE: static
          VITE_BASE_PATH: /invest-os/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
